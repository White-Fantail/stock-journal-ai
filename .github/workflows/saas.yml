name: SaaS tenant isolation and financial ledger contracts
on:
  push:
    branches: [dev, main]
    paths:
      - 'services/saas_api/**'
      - 'tests/test_saas_hosted_schema.py'
      - 'tests/test_tiger_oauth_policy.py'
      - 'tests/test_saas_trade_policy.py'
      - 'scripts/verify_saas_trade_isolation.py'
      - 'scripts/verify_saas_http_isolation.py'
      - 'db/saas/**'
      - 'scripts/verify_saas_identity.py'
      - 'tests/test_saas_identity.py'
      - 'tests/test_saas_journal.py'
      - 'tests/test_saas_journal_plans.py'
      - 'tests/test_broker_connectors.py'
      - 'tests/test_broker_backfill.py'
      - 'tests/test_broker_fifo_projection.py'
      - 'tests/test_broker_reconciliation.py'
      - 'tests/test_saas_reconciliation_store.py'
      - 'tests/test_saas_ledger_publication.py'
      - 'tests/test_saas_ledger_read.py'
      - 'tests/test_saas_journal_broker_links.py'
      - 'tests/test_saas_journal_observations.py'
      - 'scripts/verify_saas_reconciliation_store.py'
      - 'tests/test_broker_worker_contract.py'
      - 'tests/test_broker_paged_contract.py'
      - 'scripts/verify_saas_paged_backfill.py'
      - 'scripts/verify_saas_broker_sync_isolation.py'
      - 'scripts/verify_saas_backfill_worker.py'
      - 'scripts/verify_saas_dispatcher.py'
      - 'scripts/verify_saas_sync_status.py'
      - 'tests/test_saas_sync_status.py'
      - 'tests/test_tiger_history_probe.py'
      - 'tests/test_saas_dispatcher.py'
      - 'services/broker_connectors/**'
      - 'scripts/verify_saas_broker_isolation.py'
      - 'apps/web/**'
      - 'docs/**'
      - 'scripts/check_public_repo.py'
      - 'README.md'
      - 'AGENTS.md'
      - '.gitignore'
      - '.github/workflows/saas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saas-postgres-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: saas_ci
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: journal_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas_ci -d journal_saas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SAAS_DATABASE_URL: postgresql://saas_ci:synthetic_only@localhost:5432/journal_saas_test
      SAAS_TEST_DB_ACK: YES_DISPOSABLE_SAAS_DB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python dependencies
        run: pip install -r services/saas_api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies and check Next.js TypeScript
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-audit
          npm run typecheck
          npm run test:security
      - name: Build Next.js using synthetic CI-only OAuth configuration
        working-directory: apps/web
        env:
          AUTH_SECRET: synthetic_ci_auth_secret_no_customer_data_0123456789abcdef0123456789
          AUTH_GOOGLE_ID: synthetic-ci-google-client
          AUTH_GOOGLE_SECRET: synthetic-ci-google-secret
          AUTH_URL: https://positionary.example.invalid
          SAAS_INTERNAL_API_URL: https://internal.example.invalid
          SAAS_INTERNAL_SECRET: synthetic_ci_internal_hmac_secret_without_prod_data_0123456789
        run: npm run build
      - name: Fail if personal portfolio or broker files are tracked
        run: python scripts/check_public_repo.py
      - name: Validate offline Google claims and HMAC request checks
        run: python -m unittest discover -s tests -p 'test_saas_identity.py' -v
      - name: Check Python modules compile
        run: python -m compileall -q services/saas_api
      - name: Validate journal and nonce input contracts
        run: python -m unittest discover -s tests -p 'test_saas_journal.py' -v
      - name: Validate immutable target/stop plan input contracts
        run: python -m unittest discover -s tests -p 'test_saas_journal_plans.py' -v
      - name: Validate broker adapter registry and offline Tiger fixtures
        run: python -m unittest discover -s tests -p 'test_broker_connectors.py' -v
      - name: Validate P3 backfill window and replay contracts
        run: python -m unittest discover -s tests -p 'test_broker_backfill.py' -v
      - name: Validate offline FIFO projection fails closed on unknown fees and coverage
        run: python -m unittest discover -s tests -p 'test_broker_fifo_projection.py' -v
      - name: Validate P4 reconciliation refuses gaps, duplicate versions and mismatched holdings
        run: python -m unittest discover -s tests -p 'test_broker_reconciliation.py' -v
      - name: Validate P4 attestation, fingerprint and money precision gates
        run: python -m unittest discover -s tests -p 'test_saas_reconciliation_store.py' -v
      - name: Validate append-only broker ledger publication gate
        run: python -m unittest discover -s tests -p 'test_saas_ledger_publication.py' -v
      - name: Validate signed private broker-ledger read gates
        run: python -m unittest discover -s tests -p 'test_saas_ledger_read.py' -v
      - name: Validate broker fill note association contract and forgery guard
        run: python -m unittest discover -s tests -p 'test_saas_journal_broker_links.py' -v
      - name: Validate Tiger hosted OAuth policy and AEAD vault
        run: python -m unittest discover -s tests -p 'test_tiger_oauth_policy.py' -v
      - name: Validate offline worker source contract is fail closed
        run: python -m unittest discover -s tests -p 'test_broker_worker_contract.py' -v
      - name: Validate offline bounded page contract and cursor validation
        run: python -m unittest discover -s tests -p 'test_broker_paged_contract.py' -v
      - name: Validate offline dispatcher disabled by default
        run: python -m unittest discover -s tests -p 'test_saas_dispatcher.py' -v
      - name: Validate Tiger documented inquiry probe rejects undocumented mapping
        run: python -m unittest discover -s tests -p 'test_tiger_history_probe.py' -v
      - name: Validate sync processing progress never certifies portfolio history
        run: python -m unittest discover -s tests -p 'test_saas_sync_status.py' -v
      - name: Validate hosted schema bootstrap policy (no live connection)
        run: python -m unittest discover -s tests -p 'test_saas_hosted_schema.py' -v
      - name: Exercise hosted bootstrap against separate disposable CI database
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["SAAS_DATABASE_URL"], autocommit=True) as c:
              c.execute("CREATE DATABASE journal_hosted_saas_test")
          PY
          export SAAS_DATABASE_URL=postgresql://saas_ci:synthetic_only@localhost:5432/journal_hosted_saas_test
          python -m services.saas_api.schema_admin --apply --approve-schema-change --backup-verified
          python -m services.saas_api.schema_admin --status
          python -m services.saas_api.schema_admin --apply --approve-schema-change --backup-verified
      - name: Exercise production-gated deploy on disposable PostgreSQL 18
        run: |
          python - <<'PY'
          import os, subprocess, sys, psycopg
          with psycopg.connect(os.environ["SAAS_DATABASE_URL"], autocommit=True) as c:
              c.execute("CREATE DATABASE journal_hosted_deploy_ci")
          env = os.environ.copy()
          env.pop("SAAS_TEST_DB_ACK", None)
          env.update({
            "SAAS_DATABASE_URL": "postgresql://saas_ci:synthetic_only@localhost:5432/journal_hosted_deploy_ci",
            "SAAS_AUTO_MIGRATE": "1",
            "SAAS_MIGRATION_BACKUP_VERIFIED": "1", # CI simulation, not production backup proof
            "SAAS_TRADE_RUNTIME_PASSWORD": "a" * 64,
            "SAAS_BROKER_RUNTIME_PASSWORD": "b" * 64,
            "SAAS_PUBLICATION_RUNTIME_PASSWORD": "d" * 64,
            "RAILWAY_PROJECT_ID": "881e854d-86a2-436f-86a5-b17e5f92e912",
            "RAILWAY_SERVICE_ID": "350c9a6f-4f1e-4aaf-a50d-9ea8c1c5d31e",
            "RAILWAY_ENVIRONMENT_ID": "1a79e220-c75e-40be-a608-2d1f21a3ebb8",
            "RAILWAY_ENVIRONMENT_NAME": "production",
            "RAILWAY_GIT_BRANCH": "main",
            "RAILWAY_GIT_REPO_OWNER": "White-Fantail",
            "RAILWAY_GIT_REPO_NAME": "stock-journal-ai",
          })
          for _ in range(2):
              subprocess.run([sys.executable, "-m", "services.saas_api.schema_admin", "--deploy"],
                             env=env, check=True)
          with psycopg.connect(env["SAAS_DATABASE_URL"]) as c:
              versions = [r[0] for r in c.execute("SELECT name FROM saas_schema_versions ORDER BY name")]
              assert versions == ["001_identity.sql", "002_broker_links.sql", "003_trade_events.sql", "004_csv_imports.sql", "005_remove_csv_imports.sql", "006_journal_security.sql", "007_trade_runtime_login.sql", "008_tiger_oauth.sql", "009_tiger_runtime_login.sql", "010_broker_backfill_staging.sql", "011_backfill_worker_fencing.sql", "012_backfill_page_resume.sql", "013_broker_dispatch_queue.sql", "014_reconciliation_audit.sql", "015_reconciliation_lineage.sql", "016_journal_plan_revisions.sql", "017_broker_ledger_publication.sql", "018_journal_broker_fill_links.sql", "019_tiger_market_quotes.sql", "020_journal_tiger_observation_links.sql"]
              assert c.execute("SELECT to_regclass('public.saas_csv_import_batches')").fetchone()[0] is None
              assert c.execute("SELECT to_regclass('public.saas_csv_import_rows')").fetchone()[0] is None
              assert c.execute("SELECT to_regclass('public.saas_trade_events')").fetchone()[0] is not None
          with psycopg.connect("postgresql://saas_trade_app:" + "a"*64 +
                             "@localhost:5432/journal_hosted_deploy_ci") as limited:
              from services.saas_api.trades import _runtime_safety
              _runtime_safety(limited)
              assert limited.execute("SELECT rolsuper,rolbypassrls FROM pg_roles WHERE rolname=current_user").fetchone() == (False,False)
          PY
      - name: Broker runtime cannot bypass RLS and does not inherit trade event privileges
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://saas_broker_app:" + "b"*64 +
                    "@localhost:5432/journal_hosted_deploy_ci") as conn:
              from services.saas_api.tiger_oauth import _scope, TigerError
              flags = conn.execute("SELECT rolsuper,rolbypassrls,pg_has_role(current_user,'saas_broker_runtime','USAGE'),has_table_privilege(current_user,'saas_tiger_grants','SELECT') FROM pg_roles WHERE rolname=current_user").fetchone()
              assert flags == (False, False, True, True)
              assert conn.execute("SELECT has_table_privilege(current_user,'saas_trade_events','INSERT')").fetchone()[0] is False
              assert conn.execute("SELECT count(*) FROM saas_tiger_grants").fetchone()[0] == 0
          PY
      - name: Publisher has dedicated limited RLS login; broker cannot insert release
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://saas_publication_app:" + "d"*64 +
                "@localhost:5432/journal_hosted_deploy_ci") as publisher:
              rows = publisher.execute("""SELECT rolsuper,rolbypassrls,
                  pg_has_role(current_user,'saas_publication_runtime','USAGE'),
                  has_table_privilege(current_user,'saas_broker_ledger_publications','INSERT'),
                  has_table_privilege(current_user,'saas_verified_execution_stage','INSERT')
                  FROM pg_roles WHERE rolname=current_user""").fetchone()
              assert rows == (False,False,True,True,False),rows
              assert publisher.execute("SELECT count(*) FROM saas_broker_ledger_publications").fetchone()[0] == 0
          with psycopg.connect("postgresql://saas_broker_app:" + "b"*64 +
                "@localhost:5432/journal_hosted_deploy_ci") as collector:
              assert collector.execute("""SELECT has_table_privilege(
                  current_user,'saas_broker_ledger_publications','INSERT')""").fetchone()[0] is False
          PY
      - name: Verify 004-to-005 live upgrade and nonempty-data rollback on disposable PostgreSQL 18
        run: |
          python - <<'PY'
          import os, subprocess, sys
          import psycopg
          from services.saas_api.schema_admin import manifest
          suites = (("journal_upgrade_empty", False), ("journal_upgrade_occupied", True))
          sources = manifest()
          assert len(sources) == 20
          with psycopg.connect(os.environ["SAAS_DATABASE_URL"], autocommit=True) as c:
              for name, _ in suites:
                  c.execute("CREATE DATABASE " + name)
          for name, occupied in suites:
              dsn = "postgresql://saas_ci:synthetic_only@localhost:5432/" + name
              with psycopg.connect(dsn) as c:
                  with c.transaction():
                      c.execute("CREATE TABLE saas_schema_versions (name text PRIMARY KEY, sha256 char(64) NOT NULL)")
                      for version, digest, source in sources[:4]:
                          c.execute(source)
                          c.execute("INSERT INTO saas_schema_versions VALUES (%s,%s)", (version, digest))
                      if occupied:
                          u = c.execute(
                              "INSERT INTO saas_users(google_subject,email) VALUES ('synthetic-google-subject','ci@example.invalid') RETURNING id"
                          ).fetchone()[0]
                          w = c.execute(
                              "INSERT INTO saas_workspaces(owner_user_id) VALUES (%s) RETURNING id", (u,)
                          ).fetchone()[0]
                          c.execute("INSERT INTO saas_workspace_memberships(workspace_id,user_id) VALUES (%s,%s)", (w,u))
                          c.execute(
                              """INSERT INTO saas_csv_import_batches
                                 (workspace_id,author_user_id,file_fingerprint,row_count)
                                 VALUES (%s,%s,%s,1)""",
                              (w,u,"a"*64))
              env = os.environ.copy()
              env.pop("SAAS_TEST_DB_ACK", None)
              env.update({
                  "SAAS_DATABASE_URL":dsn,
                  "SAAS_AUTO_MIGRATE":"1",
                  "SAAS_MIGRATION_BACKUP_VERIFIED":"1", # synthetic CI test only
                  "SAAS_TRADE_RUNTIME_PASSWORD":"a"*64,
                  "SAAS_BROKER_RUNTIME_PASSWORD":"b"*64,
                  "RAILWAY_PROJECT_ID":"881e854d-86a2-436f-86a5-b17e5f92e912",
                  "RAILWAY_SERVICE_ID":"350c9a6f-4f1e-4aaf-a50d-9ea8c1c5d31e",
                  "RAILWAY_ENVIRONMENT_ID":"1a79e220-c75e-40be-a608-2d1f21a3ebb8",
                  "RAILWAY_ENVIRONMENT_NAME":"production",
                  "RAILWAY_GIT_BRANCH":"main",
                  "RAILWAY_GIT_REPO_OWNER":"White-Fantail",
                  "RAILWAY_GIT_REPO_NAME":"stock-journal-ai",
              })
              result = subprocess.run([sys.executable,"-m","services.saas_api.schema_admin","--deploy"],env=env)
              assert (result.returncode != 0) if occupied else (result.returncode == 0)
              with psycopg.connect(dsn) as c:
                  names = [v[0] for v in c.execute("SELECT name FROM saas_schema_versions ORDER BY name")]
                  assert len(names) == (4 if occupied else 20), names
                  assert c.execute("SELECT to_regclass('public.saas_trade_events')").fetchone()[0] is not None
                  if occupied:
                      assert c.execute("SELECT count(*) FROM saas_csv_import_batches").fetchone()[0] == 1
                      assert c.execute("SELECT to_regclass('public.saas_csv_import_rows')").fetchone()[0] is not None
                  else:
                      assert c.execute("SELECT to_regclass('public.saas_csv_import_batches')").fetchone()[0] is None
                      assert c.execute("SELECT to_regclass('public.saas_csv_import_rows')").fetchone()[0] is None
          PY
      - name: Validate manual trade input and invariants (no database)
        run: python -m unittest discover -s tests -p 'test_saas_trade_policy.py' -v
      - name: Apply and verify fresh SaaS schema, with no CSV import tables (NOT legacy migrations)
        run: |
          python db/saas/migrate.py --apply
          python db/saas/migrate.py --apply
          python db/saas/migrate.py --verify
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["SAAS_DATABASE_URL"]) as c:
              assert c.execute("SELECT to_regclass('public.saas_csv_import_batches')").fetchone()[0] is None
              assert c.execute("SELECT to_regclass('public.saas_csv_import_rows')").fetchone()[0] is None
              assert c.execute("SELECT to_regclass('public.saas_trade_events')").fetchone()[0] is not None
          PY
      - name: Verify atomic account provisioning, tenant A/B RLS and revocation
        run: python scripts/verify_saas_identity.py
      - name: Verify workspace A/B broker metadata RLS and composite account FKs
        run: python scripts/verify_saas_broker_isolation.py
      - name: Verify Tiger encrypted grant and source-evidence vault A/B tenant RLS
        run: python scripts/verify_tiger_vault_isolation.py
      - name: Verify P3 durable staging A/B RLS and immutability
        run: python scripts/verify_saas_broker_sync_isolation.py
      - name: Verify P3 lease-fenced worker, grant revocation and encrypted replay
        run: python -m scripts.verify_saas_backfill_worker
      - name: Verify P3 encrypted page checkpoints, replay and tenant fences
        run: python -m scripts.verify_saas_paged_backfill
      - name: Verify dispatch-only DB role, due queue and replay fence
        run: python -m scripts.verify_saas_dispatcher
      - name: Verify Tiger private sync status A/B tenant and revoked ownership isolation
        run: python -m scripts.verify_saas_sync_status
      - name: Verify P4 immutable reconciliation staging and issue resolution A/B
        run: python -m scripts.verify_saas_reconciliation_store
      - name: Verify manual trade A/B RLS, append-only and revoked-membership denial
        run: python scripts/verify_saas_trade_isolation.py
      - name: A/B authenticated service HTTP, replay, note export and account deletion
        run: python scripts/verify_saas_http_isolation.py
      - name: Synthetic database backup and restore drill (PostgreSQL 18)
        run: |
          set -eu
          trap 'rm -f /tmp/saas-ci-restore.dump' EXIT
          docker run --rm --network host -e PGPASSWORD=synthetic_only postgres:18 \
            pg_dump -h 127.0.0.1 -U saas_ci -d journal_saas_test -Fc \
            > /tmp/saas-ci-restore.dump
          python - <<'PY'
          import os,psycopg
          with psycopg.connect(os.environ["SAAS_DATABASE_URL"],autocommit=True) as c:
              c.execute("CREATE DATABASE journal_saas_restore")
          PY
          docker run --rm --network host -i -e PGPASSWORD=synthetic_only postgres:18 \
            pg_restore -h 127.0.0.1 -U saas_ci -d journal_saas_restore \
            --no-owner --no-acl < /tmp/saas-ci-restore.dump
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://saas_ci:synthetic_only@localhost:5432/journal_saas_restore") as c:
              assert c.execute("SELECT count(*) FROM saas_schema_versions").fetchone()[0] == 20
              assert c.execute("SELECT to_regclass('public.saas_journal_records')").fetchone()[0]
              assert c.execute("SELECT to_regclass('public.saas_trade_events')").fetchone()[0]
          print("Synthetic PostgreSQL 18 backup/restore PASS (not production backup proof)")
          PY
      - name: Reject hosted or unacknowledged DB migrations
        run: |
          if env -u SAAS_TEST_DB_ACK python db/saas/migrate.py --apply; then
            echo "Unacknowledged migration unexpectedly succeeded" >&2; exit 1
          fi
          if SAAS_DATABASE_URL=postgresql://saas_ci:synthetic_only@remote.invalid:5432/journal_saas_test python db/saas/migrate.py --apply; then
            echo "Remote migration unexpectedly succeeded" >&2; exit 1
          fi
