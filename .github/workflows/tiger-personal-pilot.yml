name: Temporary Tiger personal pilot
on:
  push:
    branches: [dev, main]
    paths:
      - 'temporary/**'
      - 'tests/test_tiger_personal_pilot_v2.py'
      - 'services/saas_api/server.py'
      - 'apps/web/app/private/tiger/personal/**'
      - '.github/workflows/tiger-personal-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/saas_api/requirements.txt
      - run: python -m compileall -q temporary/tiger_personal services/saas_api/server.py
      - run: python -m unittest discover -s tests -p 'test_tiger_personal_pilot_v2.py' -v
      - run: python scripts/check_public_repo.py
